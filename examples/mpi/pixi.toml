# `pixi run -e mpi check` builds the examples with MPICH and OpenMP from conda-forge and checks
# that every rank and thread count gives the hash of the serial run.
[workspace]
name = "tandem-c-mpi-example"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[feature.mpi.dependencies]
c-compiler = "*"
make = "*"
mpich = "*"

[feature.mpi.target.osx-arm64.dependencies]
llvm-openmp = "*"

# On Linux, MPICH runs over UCX, which can fail to open a network device on CI runners. The
# example runs on one node, so shared memory is enough.
[feature.mpi.target.linux-64.activation.env]
UCX_TLS = "self,sm"

[feature.mpi.tasks]
check = "make check"

[environments]
mpi = ["mpi"]
