name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}${{ matrix.sanitize && ' / sanitizers' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, cc: gcc, cxx: g++}
          - {os: ubuntu-latest, cc: clang, cxx: clang++}
          - {os: ubuntu-latest, cc: clang, cxx: clang++, sanitize: true}
          - {os: macos-latest, cc: clang, cxx: clang++}
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ "${{ matrix.sanitize }}" = "true" ]; then
            san="-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all"
            export CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror $san"
            export CXXFLAGS="-std=c++17 -Wall -Wextra -Wpedantic -Wshadow -Werror $san"
            export LDFLAGS="$san"
          else
            export CFLAGS="-std=c99 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror"
            export CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -Wshadow -Werror"
          fi
          make test
      - name: Vector header is current
        run: |
          git clone --depth 1 https://github.com/tandem-rng/spec ../tandem-spec
          make vectors
          git diff --exit-code tests/vectors.h
